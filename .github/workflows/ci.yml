name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # control-plane is a separate repo not checked out here; acknowledge the unenforced run so governance
    # neither warns on every import nor blocks (policy enforcement is not exercised by unit tests).
    env:
      AOS_ALLOW_MISSING_CONTROL_PLANE: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agentos
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip==26.1.2
          # Production dependencies come from the hash lock. Legacy tests still
          # exercise the strangler runtime, whose compatibility dependencies are
          # exact-pinned by the project's `legacy` extra. Do not install the
          # historical unbounded requirements.txt here: doing so makes CI drift
          # whenever a transitive package publishes a new release.
          .venv/bin/pip install -q -r pylock.toml
          .venv/bin/pip install -q -e '.[legacy]'
          .venv/bin/pip install -q pytest==9.1.1 httpx==0.28.1
          .venv/bin/pip check
      - name: config
        # aoscfg.py resolves .env.local and the venv relative to the repo root (falling back to the prod
        # home path), so a plain repo-root .env.local is all CI needs — no symlink, no home-path duplication.
        run: |
          {
            echo "DATABASE_URL=postgresql://agentos:ci@127.0.0.1:5433/agentos"
            echo "AUDIT_HMAC_KEY=ci-nonsecret-hmac-key-for-tests-only"
            # a VALID (throwaway) Fernet key — vault.py builds a Fernet at import; not a real secret
            echo "VAULT_KEY=IAZ_eBnbMuj1a81QY1p-ebrjG2ZuEyM1FUJLOneibiE="
          } > .env.local
      - name: migrations
        run: |
          find postgres/initdb -maxdepth 1 -type f -name '*.sql' -print |
          awk '
          {
            count = split($0, parts, "/")
            base = parts[count]
            match(base, /^[0-9]+/)
            revision = substr(base, RSTART, RLENGTH) + 0
            stem = base
            sub(/-.*/, "", stem)
            suffix_length = length(stem) - RLENGTH
            printf "%012d\t%04d\t%s\n", revision, suffix_length, $0
          }' |
          sort -t $'\t' -k1,1n -k2,2n -k3,3 |
          cut -f3- |
          while IFS= read -r f; do
            PGPASSWORD=ci psql -h 127.0.0.1 -p 5433 -U agentos -d agentos -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: security scan
        run: .venv/bin/python scripts/security_scan.py
      - name: unit tests
        run: .venv/bin/python -m pytest tests/ -q

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: build locked non-root runtime image
        run: docker build -f deploy/Dockerfile.v2 -t agent-os-v2:ci .
      - name: build the exact migration and hosted-sandbox images
        run: |
          docker build -f deploy/Dockerfile.migrations-v2 -t agent-os-migrations-v2:ci .
          docker build -f deploy/Dockerfile.sandbox-v2 -t agent-os-sandbox-v2:ci .
      - name: smoke packaged API and worker entrypoints
        run: |
          docker run --rm agent-os-v2:ci agentos-v2 --help
          docker run --rm agent-os-v2:ci agentos-v2 worker --help
          test "$(docker image inspect agent-os-migrations-v2:ci --format '{{.Config.User}}')" = "999:999"
          test "$(docker image inspect agent-os-sandbox-v2:ci --format '{{json .Config.Entrypoint}}')" = '["python","-I","/opt/agent-os/sandbox_job.py"]'

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: validate reproducible production infrastructure
        run: |
          tofu -chdir=deploy/gcp fmt -check -recursive
          tofu -chdir=deploy/gcp init -backend=false -input=false
          tofu -chdir=deploy/gcp validate
