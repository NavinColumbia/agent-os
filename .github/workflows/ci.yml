name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agentos
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt pytest
      - name: config
        # The ~85 modules that read DATABASE_URL resolve .env.local from ~/projects/agent-os/.env.local
        # (the real production location — correct there, only "wrong" in CI where the checkout lives
        # under $GITHUB_WORKSPACE). Write the config to BOTH the home path the code expects and the
        # repo root, so both hardcoded-home and __file__-relative readers find it. No code change needed.
        run: |
          URL="postgresql://agentos:ci@127.0.0.1:5433/agentos"
          echo "DATABASE_URL=$URL" > .env.local
          mkdir -p "$HOME/projects/agent-os"
          echo "DATABASE_URL=$URL" > "$HOME/projects/agent-os/.env.local"
      - name: migrations
        run: |
          for f in postgres/initdb/*.sql; do
            PGPASSWORD=ci psql -h 127.0.0.1 -p 5433 -U agentos -d agentos -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: security scan
        run: .venv/bin/python scripts/security_scan.py
      - name: unit tests
        run: .venv/bin/python -m pytest tests/ -q
