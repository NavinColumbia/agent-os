name: agent-os-v2

x-runtime-environment: &runtime-environment
  AOS_ENVIRONMENT: staging
  AOS_V2_SYSTEM_DATABASE_URL: postgresql://agentos_runtime:${AOS_V2_DATABASE_RUNTIME_PASSWORD}@postgres:5432/agentos
  AOS_V2_APPLICATION_DATABASE_URL: postgresql://agentos_runtime:${AOS_V2_DATABASE_RUNTIME_PASSWORD}@postgres:5432/agentos
  AOS_V2_APPLICATION_VERSION: ${AOS_V2_APPLICATION_VERSION:-v2-local}
  AOS_V2_CREATE_SCHEMA: "0"
  AOS_V2_IDENTITY_MODE: ${AOS_V2_IDENTITY_MODE:-hmac}
  AOS_V2_AUTH_SECRET: ${AOS_V2_AUTH_SECRET:-}
  AOS_V2_CAPABILITY_SECRET: ${AOS_V2_CAPABILITY_SECRET:?set a separate capability signing secret}
  AOS_V2_OIDC_ISSUER: ${AOS_V2_OIDC_ISSUER:-}
  AOS_V2_OIDC_AUDIENCE: ${AOS_V2_OIDC_AUDIENCE:-}
  AOS_V2_OIDC_JWKS_URL: ${AOS_V2_OIDC_JWKS_URL:-}
  AOS_V2_OIDC_AUTHORIZATION_URL: ${AOS_V2_OIDC_AUTHORIZATION_URL:-}
  AOS_V2_OIDC_TOKEN_URL: ${AOS_V2_OIDC_TOKEN_URL:-}
  AOS_V2_OIDC_CLIENT_ID: ${AOS_V2_OIDC_CLIENT_ID:-}
  AOS_V2_OIDC_SCOPE: ${AOS_V2_OIDC_SCOPE:-openid profile email}
  AOS_V2_OIDC_AUTHORIZATION_AUDIENCE_PARAMETER: ${AOS_V2_OIDC_AUTHORIZATION_AUDIENCE_PARAMETER:-}
  AOS_V2_OIDC_ORGANIZATION_CLAIM: ${AOS_V2_OIDC_ORGANIZATION_CLAIM:-org_id}
  AOS_V2_OIDC_ROLES_CLAIM: ${AOS_V2_OIDC_ROLES_CLAIM:-roles}
  AOS_V2_OIDC_ALGORITHMS: ${AOS_V2_OIDC_ALGORITHMS:-RS256,ES256}
  AOS_V2_PUBLIC_BASE_URL: ${AOS_V2_PUBLIC_BASE_URL:-http://localhost:8080}
  AOS_V2_PREVIEW_TTL_SECONDS: ${AOS_V2_PREVIEW_TTL_SECONDS:-604800}
  AOS_V2_TENANT_MONTHLY_MODEL_BUDGET_CENTS: ${AOS_V2_TENANT_MONTHLY_MODEL_BUDGET_CENTS:-10000}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: ${AOS_V2_POSTGRES_PASSWORD:?set AOS_V2_POSTGRES_PASSWORD}
      POSTGRES_DB: agentos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - agent-os-v2-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      PGHOST: postgres
      PGUSER: agentos
      PGPASSWORD: ${AOS_V2_POSTGRES_PASSWORD:?set AOS_V2_POSTGRES_PASSWORD}
      PGDATABASE: agentos
      AOS_V2_DATABASE_RUNTIME_PASSWORD: ${AOS_V2_DATABASE_RUNTIME_PASSWORD:?set a separate runtime database password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../postgres/initdb/86-lifecycle-v2.sql:/migrations/86-lifecycle-v2.sql:ro
      - ../postgres/initdb/87-workflow-graphs-v2.sql:/migrations/87-workflow-graphs-v2.sql:ro
      - ../postgres/initdb/88-workflow-action-leases-v2.sql:/migrations/88-workflow-action-leases-v2.sql:ro
      - ../postgres/initdb/89-notifications-v2.sql:/migrations/89-notifications-v2.sql:ro
      - ../postgres/initdb/90-artifacts-v2.sql:/migrations/90-artifacts-v2.sql:ro
      - ../postgres/initdb/91-ready-tenant-discovery-v2.sql:/migrations/91-ready-tenant-discovery-v2.sql:ro
      - ../postgres/initdb/92-preview-deployments-v2.sql:/migrations/92-preview-deployments-v2.sql:ro
      - ../postgres/initdb/93-preview-capability-lifecycle-v2.sql:/migrations/93-preview-capability-lifecycle-v2.sql:ro
      - ../postgres/initdb/94-management-watch-v2.sql:/migrations/94-management-watch-v2.sql:ro
      - ../postgres/initdb/95-company-directory-v2.sql:/migrations/95-company-directory-v2.sql:ro
      - ../postgres/initdb/96-company-proposal-decisions-v2.sql:/migrations/96-company-proposal-decisions-v2.sql:ro
      - ../postgres/initdb/97-usage-meter-v2.sql:/migrations/97-usage-meter-v2.sql:ro
      - ../postgres/initdb/98-billing-v2.sql:/migrations/98-billing-v2.sql:ro
      - ../postgres/initdb/99-external-artifacts-v2.sql:/migrations/99-external-artifacts-v2.sql:ro
      - ../postgres/initdb/99z-external-onboarding-v2.sql:/migrations/99z-external-onboarding-v2.sql:ro
      - ../postgres/initdb/99zz-connectors-v2.sql:/migrations/99zz-connectors-v2.sql:ro
      - ../postgres/initdb/99zzz-memberships-v2.sql:/migrations/99zzz-memberships-v2.sql:ro
    command:
      - sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -f /migrations/86-lifecycle-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/87-workflow-graphs-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/88-workflow-action-leases-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/89-notifications-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/90-artifacts-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/91-ready-tenant-discovery-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/92-preview-deployments-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/93-preview-capability-lifecycle-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/94-management-watch-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/95-company-directory-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/96-company-proposal-decisions-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/97-usage-meter-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/98-billing-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/99-external-artifacts-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/99z-external-onboarding-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/99zz-connectors-v2.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/99zzz-memberships-v2.sql
        psql -v ON_ERROR_STOP=1 \
          -v runtime_password="$$AOS_V2_DATABASE_RUNTIME_PASSWORD" <<'SQL'
        SELECT format(
          'CREATE ROLE agentos_runtime LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT',
          :'runtime_password'
        )
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agentos_runtime')
        \gexec
        ALTER ROLE agentos_runtime WITH LOGIN PASSWORD :'runtime_password'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT;
        GRANT CONNECT ON DATABASE agentos TO agentos_runtime;
        GRANT USAGE ON SCHEMA public TO agentos_runtime;
        GRANT agentos_app, agentos_worker TO agentos_runtime;
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE SCHEMA IF NOT EXISTS dbos AUTHORIZATION agentos_runtime;
        ALTER SCHEMA dbos OWNER TO agentos_runtime;
        SQL
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.v2
    environment:
      <<: *runtime-environment
      PORT: "8080"
      AOS_V2_BILLING_MODE: ${AOS_V2_BILLING_MODE:-disabled}
      AOS_V2_STRIPE_SECRET_KEY: ${AOS_V2_STRIPE_SECRET_KEY:-}
      AOS_V2_STRIPE_WEBHOOK_SECRET: ${AOS_V2_STRIPE_WEBHOOK_SECRET:-}
      AOS_V2_STRIPE_STARTER_PRICE_ID: ${AOS_V2_STRIPE_STARTER_PRICE_ID:-}
      AOS_V2_STRIPE_GROWTH_PRICE_ID: ${AOS_V2_STRIPE_GROWTH_PRICE_ID:-}
      AOS_V2_STRIPE_STARTER_MODEL_BUDGET_CENTS: ${AOS_V2_STRIPE_STARTER_MODEL_BUDGET_CENTS:-50000}
      AOS_V2_STRIPE_GROWTH_MODEL_BUDGET_CENTS: ${AOS_V2_STRIPE_GROWTH_MODEL_BUDGET_CENTS:-250000}
      AOS_V2_STRIPE_API_VERSION: ${AOS_V2_STRIPE_API_VERSION:-2025-06-30.basil}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AOS_V2_PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.v2
    command: ["agentos-v2", "worker"]
    environment:
      <<: *runtime-environment
      AOS_V2_MODEL: ${AOS_V2_MODEL:?set an explicit PydanticAI provider:model}
      AOS_V2_WORKER_ORGANIZATIONS: ${AOS_V2_WORKER_ORGANIZATIONS:-}
      AOS_V2_TENANT_DISCOVERY_LIMIT: ${AOS_V2_TENANT_DISCOVERY_LIMIT:-128}
      AOS_V2_MAX_TURN_COST_CENTS: ${AOS_V2_MAX_TURN_COST_CENTS:-100}
      AOS_V2_MODEL_REQUEST_TIMEOUT_SECONDS: ${AOS_V2_MODEL_REQUEST_TIMEOUT_SECONDS:-120}
      AOS_V2_MANAGEMENT_CHECK_SECONDS: ${AOS_V2_MANAGEMENT_CHECK_SECONDS:-30}
      AOS_V2_SLOW_WORK_SECONDS: ${AOS_V2_SLOW_WORK_SECONDS:-300}
      AOS_V2_MANAGEMENT_ESCALATION_CHECKS: ${AOS_V2_MANAGEMENT_ESCALATION_CHECKS:-3}
      AOS_V2_CONNECTOR_SECRET_BACKEND: file
      AOS_V2_CONNECTOR_SECRET_DIR: /run/secrets/agent-os-connectors
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${AOS_V2_CONNECTOR_SECRET_HOST_DIR:-./connector-secrets}:/run/secrets/agent-os-connectors:ro
    restart: unless-stopped
    # One provider request is bounded, but a complete agent turn may contain
    # retries/tool cleanup. Give SIGTERM enough time to stop without lease theft.
    stop_grace_period: 10m

volumes:
  agent-os-v2-postgres:
