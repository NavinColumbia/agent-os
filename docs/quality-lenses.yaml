# Quality-lens registry — the machine-enforced version of the audit's core rule.
#
# THE META-RULE: a quality lens is only "in the pipeline" (status: enforced) when it has all THREE legs:
#   1. STANDARD  — a written doc that says what "good" means (docs/STANDARDS-*.md), OR an executable
#                  spec (a scanner/test) when a prose doc adds nothing.
#   2. ROLE      — a gating role whose responsibilities/must_never name the lens, so an agent is
#                  accountable for it (control-plane/roles/<file>.yaml).
#   3. GUARD     — an automated check WIRED INTO selftest.sh (by its exact ck/ckp label) that FAILS
#                  CLOSED, so the lens can't be skimmed.
#
# scripts/test_quality_lenses_wired.py asserts every `enforced` lens still has all three legs. This is the
# structural fix for our recurring failure ("the fleet missed a whole CLASS because nothing enforced it"):
#   - a lens can't silently decay from enforced -> aspirational (remove its guard -> selftest goes red),
#   - promoting a `building`/`backlog` lens to `enforced` REQUIRES wiring all three legs (no hand-waving),
#   - `backlog` lenses are tracked in the open, so missing coverage is visible instead of discovered by a
#     user hitting the bug.
#
# status: enforced | building | backlog
#   enforced = all three legs present and asserted (the guard fails if any leg goes missing).
#   building = standard/role landing now; guard not yet wired (reported, not failed).
#   backlog  = recognized as needed; not yet in the pipeline (the honest "we don't cover this YET" list).

lenses:
  - id: functional-correctness
    status: enforced
    standard: null                       # per-module selftests + pytest are the executable spec
    role: { file: qa-security, keyword: test }
    guard: "unit test suite (pytest)"

  - id: user-journey
    status: enforced
    standard: docs/STANDARDS-qa.md
    role: { file: qa-security, keyword: journey }
    guard: "console click-through (real browser)"

  - id: timing-idle-disruption
    status: enforced
    standard: docs/STANDARDS-qa.md
    role: { file: qa-security, keyword: dwell }
    guard: "console click-through (real browser)"   # idle-dwell + timer-leak assertions live in console_e2e

  - id: impact-analysis-planning
    status: enforced
    standard: docs/STANDARDS-planning.md
    role: { file: software-architect, keyword: impact }
    guard: "callsite signature wiring"

  - id: governance-enforcement
    status: enforced
    standard: null
    role: { file: qa-security, keyword: security }
    guard: "enforcement-layer consistency (gov==hook)"

  - id: governance-wiring
    status: enforced
    standard: null
    role: { file: qa-security, keyword: security }
    guard: "governance controls wired"              # test_governance_wired.py — newly wired by this fix

  - id: security
    status: enforced
    standard: null                                  # security_scan.py is the executable spec
    role: { file: qa-security, keyword: security }
    guard: "security scan (invariants)"

  # --- the product-craft class the user hit — now enforced (standard + design-ux role + gating e2e guard) ---
  - id: product-craft-ux
    status: enforced
    standard: docs/STANDARDS-product-quality.md
    role: { file: design-ux, keyword: craft }
    guard: "console click-through (real browser)"   # console_e2e create-account-quality: confirm-pw + show/hide + autocomplete + labels (gates: exit 1 on fail)

  - id: accessibility
    status: enforced
    standard: docs/STANDARDS-product-quality.md
    role: { file: design-ux, keyword: accessib }
    guard: "console click-through (real browser)"   # console_e2e a11y: every visible input must have an accessible name

  # --- product-craft trio: enforced by console_craft_e2e (responsive @390px + empty-states + microcopy) ---
  - id: responsive-mobile
    status: enforced
    standard: docs/STANDARDS-product-quality.md
    role: { file: design-ux, keyword: responsive }
    guard: "product craft (responsive/empty-states/microcopy)"
  - id: empty-loading-error-states
    status: enforced
    standard: docs/STANDARDS-product-quality.md
    role: { file: design-ux, keyword: empty }
    guard: "product craft (responsive/empty-states/microcopy)"
  - id: content-microcopy
    status: enforced
    standard: docs/STANDARDS-product-quality.md
    role: { file: design-ux, keyword: microcopy }
    guard: "product craft (responsive/empty-states/microcopy)"

  # --- platform lenses enforced via existing guards ---
  - id: observability-telemetry
    status: enforced
    standard: null                                  # metricsexport.py / traceview.py are the executable spec
    role: { file: devops-sre, keyword: observ }
    guard: "observability + trace explorer"
  - id: data-integrity-migrations
    status: enforced
    standard: null                                  # platform/snapshot.py round-trips the DB; migrate.sh is idempotent
    role: { file: database-admin, keyword: migrat }
    guard: "portable encrypted snapshot"
  - id: resilience-supervision
    status: enforced
    standard: null                                  # watchdog(detect)+responder(auto-restart) are the executable spec
    role: { file: devops-sre, keyword: heal }
    guard: "daemon supervision wired"               # every critical serving daemon is detected-down + auto-restarted
  - id: acceptance-dogfood
    status: enforced
    standard: docs/STANDARDS-acceptance.md
    role: { file: qa-security, keyword: acceptance }
    guard: "acceptance dogfood wired"               # scripts/dogfood.py: rotating demanding-user pass -> files findings, scheduled weekly

  # --- deferred WITH REASON (a decision, not a silent gap) — revisit triggers stated ---
  - id: performance-load
    status: deferred
    reason: "tenant-SERVICE load is already probed by run_service_qa (concurrency) + eval_factory hard tier; a dedicated console/platform load suite is premature for a localhost single-CEO pre-launch tool. Revisit at multi-tenant cloud."
  - id: i18n-readiness
    status: deferred
    reason: "English-only pre-launch internal tool; full string-extraction/i18n is a large refactor with no current user need. Revisit when a non-English market is targeted."
  - id: docs-onboarding
    status: deferred
    reason: "in-app guided onboarding wizard exists and is guarded ('guided onboarding wizard'); formal end-user product docs + a mandated docs role are deferred to pre-launch. Revisit before public launch."
