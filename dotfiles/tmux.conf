# ~/.tmux.conf — persistent sessions + smooth scroll + easy copy to Windows clipboard.
# Created for agent-os setup. Uses Windows' built-in clip.exe (no install needed).

# Mouse ON: wheel scrolls tmux's own scrollback (doesn't fight app redraws),
# and you can drag to select text even while scrolled up.
set -g mouse on

# Bigger scrollback so you rarely lose earlier output.
set -g history-limit 50000

# Snappier escape handling.
set -sg escape-time 10

# --- Copy to the WINDOWS clipboard on mouse-drag release ---
# Drag to select (even while scrolled up) -> on release it copies to Windows clipboard.
# copy-pipe (NOT -and-cancel) = copy but STAY scrolled where you are; press q to return to live.
# Paste back into the terminal with Ctrl+Shift+V as usual.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe "/mnt/c/Windows/System32/clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "/mnt/c/Windows/System32/clip.exe"
# Also: in copy-mode, Enter copies the selection to the Windows clipboard.
bind -T copy-mode    Enter send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"

# Clear status bar so you always know you're in tmux.
set -g status-style "bg=colour236,fg=colour250"
set -g status-right "tmux | %H:%M"
