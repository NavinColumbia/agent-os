services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: agentos-ntfy
    command: serve
    environment:
      - NTFY_BASE_URL=http://localhost:8080
      - NTFY_LISTEN_HTTP=:80
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_CACHE_DURATION=48h
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      # localhost-bound + hard-to-guess topic is the security boundary for now.
      # When we expose this over Tailscale (Step 5) we switch to deny-all + tokens.
      - NTFY_AUTH_DEFAULT_ACCESS=read-write
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
    volumes:
      - ./cache:/var/cache/ntfy
      - ./lib:/var/lib/ntfy
    # CRITICAL: bind to loopback ONLY — never 0.0.0.0.
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
