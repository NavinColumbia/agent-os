services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentos-postgres
    environment:
      - POSTGRES_USER=agentos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in postgres/.env}
      - POSTGRES_DB=agentos
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # localhost ONLY, on 5433 to avoid clashing with any system postgres on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 10s
      timeout: 5s
      retries: 5
