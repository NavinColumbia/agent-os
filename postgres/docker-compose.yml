services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentos-postgres
    environment:
      - POSTGRES_USER=agentos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in postgres/.env}
      - POSTGRES_DB=agentos
    command:
      - postgres
      - -c
      - max_connections=${AOS_POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${AOS_POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${AOS_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - maintenance_work_mem=${AOS_POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - work_mem=${AOS_POSTGRES_WORK_MEM:-4MB}
      - -c
      - temp_file_limit=${AOS_POSTGRES_TEMP_FILE_LIMIT:-2GB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # localhost ONLY, on 5433 to avoid clashing with any system postgres on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: ${AOS_POSTGRES_MEMORY_LIMIT:-3g}
    memswap_limit: ${AOS_POSTGRES_MEMORY_SWAP_LIMIT:-4g}
    mem_reservation: ${AOS_POSTGRES_MEMORY_RESERVATION:-512m}
    cpus: ${AOS_POSTGRES_CPUS:-4.0}
    pids_limit: ${AOS_POSTGRES_PIDS_LIMIT:-256}
    shm_size: ${AOS_POSTGRES_SHM_SIZE:-256m}
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 10s
      timeout: 5s
      retries: 5
