[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.1.0"
description = "Durable, human-governed AI company and product execution platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "click==8.2.1",
  "cryptography==49.0.0",
  "dbos==2.24.0",
  "fastapi==0.138.0",
  "google-api-core==2.36.0",
  "google-auth==2.57.1",
  "google-cloud-storage==3.13.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pyjwt==2.13.0",
  "pydantic==2.13.4",
  "pydantic-ai-slim[anthropic,google,mcp,openai]==2.41.0",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "sqlalchemy==2.0.51",
  "uvicorn==0.49.0",
]

[project.optional-dependencies]
legacy = [
  "faster-whisper==1.2.1",
  "huggingface-hub==0.36.2",
  "inspect-ai==0.3.240",
  "nats-py==2.15.0",
]

[project.scripts]
agentos-v2 = "agent_os.entrypoints.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_os.api" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
